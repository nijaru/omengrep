name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-12-04
  RUSTC_BOOTSTRAP: 1

jobs:
  # ============================================================================
  # STAGE 1: Verify version and run checks
  # ============================================================================

  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or Cargo.toml
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match confirmed"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify workspace packages
        run: cargo package --workspace --locked

  # ============================================================================
  # STAGE 2: Build binaries (parallel)
  # ============================================================================

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: og-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/og LICENSE dist/

      - name: Create tarball
        run: |
          cd dist
          tar czf ${{ matrix.artifact_name }}.tar.gz og LICENSE
          if command -v sha256sum &> /dev/null; then
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz*

  # ============================================================================
  # STAGE 3: Create GitHub Release
  # ============================================================================

  create-release:
    name: Create GitHub Release
    needs: [verify, build-binaries]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # Resume a draft on retry, but never modify a published release.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then
              gh release upload "$TAG" artifacts/* --clobber
            fi
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --draft \
              artifacts/*
          fi

  # ============================================================================
  # STAGE 4: Publish to crates.io (trusted publishing via OIDC)
  # ============================================================================

  publish-crates:
    name: Publish to crates.io
    needs: [verify, build-binaries]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # New crates need a manual first publication before enabling OIDC.
          # Publish the library before the binary so Cargo can resolve it.
          publish() {
            local crate=$1 status
            status=$(curl -sS --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$status" in
              200) echo "$crate $VERSION already published; skipping" ;;
              404) cargo publish --locked -p "$crate" ;;
              *) echo "Could not check $crate $VERSION on crates.io (HTTP $status)" >&2; return 1 ;;
            esac
          }
          publish og-core
          publish omengrep

  # ============================================================================
  # STAGE 6: Update Homebrew tap (after GitHub assets are public)
  # ============================================================================

  update-homebrew:
    name: Update Homebrew Tap
    needs: [verify, finalize]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nijaru/homebrew-tap
          token: ${{ secrets.TAP_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo nijaru/omengrep \
            --pattern '*.sha256'

      - name: Update formula
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          export MAC_ARM64_SHA
          MAC_ARM64_SHA=$(awk '{print $1}' og-aarch64-apple-darwin.tar.gz.sha256)

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/og.rb")
          content = formula.read_text()
          tag = os.environ["TAG"]
          mac_arm64_sha = os.environ["MAC_ARM64_SHA"]

          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"invalid tag: {tag}")
          if not re.fullmatch(r"[0-9a-f]{64}", mac_arm64_sha):
              raise SystemExit(f"invalid macOS ARM64 SHA-256: {mac_arm64_sha}")

          def replace(pattern, replacement):
              global content
              content, count = re.subn(pattern, replacement, content)
              if count != 1:
                  raise SystemExit(f"expected one match for {pattern!r}, found {count}")

          replace(
              r'https://github\.com/nijaru/omengrep/releases/download/v[^/]+/'
              r'og-aarch64-apple-darwin\.tar\.gz',
              f'https://github.com/nijaru/omengrep/releases/download/{tag}/'
              'og-aarch64-apple-darwin.tar.gz',
          )
          replace(
              r'(url "[^"]*og-aarch64-apple-darwin\.tar\.gz"\n\s+sha256 )"[^"]+"',
              lambda match: f'{match.group(1)}"{mac_arm64_sha}"',
          )
          formula.write_text(content)
          PY

      - name: Validate formula syntax
        run: ruby -c Formula/og.rb

      - name: Commit and push
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/og.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore: update og to $TAG"
            git push
          else
            echo "Formula already up to date"
          fi

  # ============================================================================
  # STAGE 5: Finalize GitHub release after crates.io publication
  # ============================================================================

  finalize:
    name: Finalize Release
    needs: [verify, create-release, publish-crates]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: https://github.com/nijaru/omengrep/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **crates.io**: https://crates.io/crates/omengrep/$VERSION" >> $GITHUB_STEP_SUMMARY
