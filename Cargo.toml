[workspace]
resolver = "3"
members = ["crates/og", "crates/og-core"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/nijaru/omengrep"
homepage = "https://github.com/nijaru/omengrep"

[workspace.dependencies]
og-core = { path = "crates/og-core" }

anyhow = "1"
usage = { package = "usage-rs", version = "6" }
owo-colors = "4"
ignore = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
